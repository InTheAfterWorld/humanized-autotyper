[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanized-autotyper"
dynamic = ["version"]
description = "模拟真人打字节奏的自动输入器：对数正态延迟、突发快打、错字回删、长暂停与恢复仪式"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # 只有真实输入（--live / GUI 实机）才会 import pynput；
    # dry-run、自检、审计日志都不需要它。
    "pynput>=1.7",
]
license = { text = "MIT" }
authors = [{ name = "LXTimer" }]
keywords = ["automation", "typing", "keystrokes", "humanize", "pynput", "vscode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
# 项目主页：PyPI 上「Project links」区块会显示这一条
[project.urls]
Homepage = "https://github.com/InTheAfterWorld/humanized-autotyper"
Source = "https://github.com/InTheAfterWorld/humanized-autotyper"

[project.scripts]
autotyper = "humanized_autotyper.main:main"
autotyper-gui = "humanized_autotyper.gui:main"
autotyper-report = "humanized_autotyper.report:main"

[tool.setuptools]
packages = ["humanized_autotyper"]

[tool.setuptools.dynamic]
version = {attr = "humanized_autotyper.__version__"}
